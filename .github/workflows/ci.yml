name: CI multiplataforma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar proyecto (plataformas, dependencias, Drift, web)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/preparar_proyecto.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - id: commit
        name: Guardar archivos generados
        env:
          ES_RAMA: ${{ github.ref_type == 'branch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$ES_RAMA" = "true" ] && ! git diff --cached --quiet; then
            git commit -m "ci: archivos generados por flutter create, pub, build_runner y recursos web"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pruebas:
    name: Análisis y pruebas (${{ matrix.os }})
    needs: preparar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  web:
    name: Compilar web
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar-web:
    name: Publicar en GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Compilar Windows
    needs: preparar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: gestor_tareas_windows
          path: build/windows/x64/runner/Release

  android:
    name: Compilar Android (APK)
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gestor_tareas_android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publicar release con ejecutables
    if: contains(github.event.head_commit.message, '[release]')
    needs: [pruebas, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artefactos
          (cd gestor_tareas_windows && zip -qr ../gestor_tareas_windows.zip .)
          cp gestor_tareas_android/app-release.apk gestor_tareas_android.apk
          gh release create "v1.0.${{ github.run_number }}" -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Gestor de tareas v1.0.${{ github.run_number }}" \
            --notes "Ejecutables compilados por GitHub Actions: Windows (zip, ejecutar gestor_tareas_local.exe) y Android (APK). Versión web: https://andreaprz28.github.io/gestor_tareas_local/" \
            gestor_tareas_windows.zip gestor_tareas_android.apk
